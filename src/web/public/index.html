<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp AI Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">🤖 WA AI</div>
        <div class="bot-status-indicator" id="statusIndicator">
          <span class="status-dot offline"></span>
          <span class="status-text">Загрузка...</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="/settings" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Настройки</span>
        </a>
        <a href="/memory" class="nav-item" data-page="memory">
          <span class="nav-icon">🧠</span>
          <span class="nav-label">Память</span>
        </a>
        <a href="/scheduler" class="nav-item" data-page="scheduler">
          <span class="nav-icon">⏰</span>
          <span class="nav-label">Планировщик</span>
        </a>
        <a href="/logs" class="nav-item" data-page="logs">
          <span class="nav-icon">📋</span>
          <span class="nav-label">Логи</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="/api/bot/logout" class="nav-item logout-btn" onclick="event.preventDefault(); logout();">
          <span class="nav-icon">🚪</span>
          <span class="nav-label">Выйти</span>
        </a>
      </div>
    </aside>
    <main class="main-content" id="mainContent">
      <div class="loading-screen">
        <div class="spinner"></div>
        <p>Загрузка...</p>
      </div>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/app.js"></script>
  <script>
    function logout() {
      document.cookie = 'auth_token=; path=/; max-age=0';
      window.location.href = '/login';
    }
  </script>
</body>
</html>
